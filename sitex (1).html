button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.7);box-shadow:0 2px 16px rgba(18,37,79,.08)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 3%}
.logo{font:800 28px/1 Outfit,sans-serif;color:var(--navy);letter-spacing:-.5px}
.logo b{background:var(--acc);color:#fff;border-radius:8px;padding:2px 7px;margin-left:2px}
#q{order:3;flex:1 1 100%;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;outline-offset:0}
#adminBtn{margin-left:auto}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 3% 10px;scrollbar-width:none}
#tabs a{flex:none;padding:6px 16px;border-radius:999px;font-weight:500;font-size:14.5px;color:var(--mute)}
#tabs a.on{background:var(--navy);color:#fff}
.btn{border:0;border-radius:999px;padding:8px 18px;font-weight:600;background:var(--navy);color:#fff}
.btn.acc{background:var(--acc)}
.btn.ghost{background:rgba(18,37,79,.08);color:var(--navy)}
a.btn{display:inline-block;line-height:1.5}
.sh{display:flex;justify-content:space-between;align-items:center}
.sh h1,.sh h2{font:700 22px/1.2 Outfit,sans-serif;color:var(--ink)}
.sh a{font-size:14px;color:var(--acc);font-weight:600}
#main>.sh{margin:14px 3% 0;padding:16px 16px 0;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px 16px 0 0}
.sec{margin:14px 3%;padding:4px 16px 18px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px}
.sec .sh{padding:12px 0 10px}
.sh+.sec{margin-top:0;padding-top:12px;border-radius:0 0 16px 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.empty{margin:14px 3%;padding:22px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px;color:var(--mute)}
.empty h2{font:700 22px Outfit,sans-serif;color:var(--ink);margin-bottom:4px}
.sh+.empty{margin-top:0;border-radius:0 0 16px 16px}
.pc{background:none;border:0;text-align:left;min-width:0}
.po{position:relative;border-radius:12px;overflow:hidden;background:#dbe7f4;aspect-ratio:2/3;box-shadow:0 4px 14px rgba(18,37,79,.18)}
.po img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.pc:hover .po img{transform:scale(1.05)}
.po::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff;background:rgba(18,37,79,.45);opacity:0;transition:opacity .2s}
.pc:hover .po::after{opacity:1}
.bd{position:absolute;top:6px;left:6px;z-index:1;background:var(--navy);color:#fff;font:600 11px Outfit,sans-serif;padding:1px 8px;border-radius:999px}
.po em{position:absolute;top:6px;right:6px;z-index:1;background:var(--cyan);color:#06222b;font:700 11px Outfit,sans-serif;font-style:normal;padding:1px 8px;border-radius:999px}
.po i{position:absolute;left:0;bottom:0;height:4px;background:var(--cyan);z-index:1}
.pc b{display:block;margin-top:7px;font-weight:600;font-size:14px;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc span.m{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{margin:14px 3% 24px;padding:14px 18px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px;color:var(--mute);font-size:13px}
dialog{border:0;border-radius:16px;background:#fff;color:var(--ink);padding:0;width:min(1000px,100vw);max-width:100vw;max-height:100vh;overflow:auto;box-shadow:0 20px 60px rgba(10,25,55,.4)}
dialog::backdrop{background:rgba(10,25,55,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pad{padding:16px}
.close{position:absolute;right:8px;top:8px;z-index:2;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:22px;line-height:1}
video{display:block;width:100%;max-height:68vh;background:#000}
.info{display:flex;gap:14px}
.pp{width:92px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;flex:none;align-self:flex-start;box-shadow:0 4px 14px rgba(18,37,79,.25)}
.info h2{font:700 26px/1.15 Outfit,sans-serif;margin:6px 0}
.info p{color:var(--mute);margin-bottom:10px}
.tags span{display:inline-block;background:var(--navy);color:#fff;font:600 12px Outfit,sans-serif;padding:1px 10px;border-radius:999px;margin-right:4px}
.tags span.c{background:rgba(18,37,79,.08);color:var(--navy)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
h3.s{font:700 17px Outfit,sans-serif;border-left:3px solid var(--acc);padding-left:8px;margin:20px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ep{background:#f1f6fc;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:600;color:var(--navy)}
.ep.on{background:var(--acc);border-color:var(--acc);color:#fff}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
progress{width:100%;height:8px;accent-color:var(--acc)}
.msg{font-size:14px;min-height:20px}
.msg.err{color:#d03a3a}
[hidden]{display:none!important}
#sortSel{border-radius:999px;padding:5px 12px;font-size:14px}
.gch{display:flex;flex-wrap:wrap;gap:6px}
.gch label{display:inline-flex;align-items:center;gap:5px;background:#f1f6fc;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--navy)}
.gch input{padding:0}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.er{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:#f1f6fc;margin-bottom:8px}
.er .th{position:relative;width:96px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex:none;background:#dbe7f4;border:0;padding:0}
.er .th img{width:100%;height:100%;object-fit:cover;display:block}
.er .th i{position:absolute;left:0;bottom:0;height:3px;background:var(--cyan)}
.er .tx{flex:1;min-width:0;background:none;border:0;text-align:left}
.er .tx b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er .tx span{font-size:12px;color:var(--mute)}
.er .ad{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.er .ad button,.er .ad select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-size:13px}
.er .ad button:disabled{opacity:.35;cursor:default}
@media(min-width:700px){
  #q{order:0;flex:1;max-width:520px;margin:0 auto}
  #adminBtn{margin-left:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 12px}
  dialog{max-height:94vh}
  .pp{width:150px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <a href="#accueil" class="logo">Anim<b>PIX</b></a>
    <input id="q" type="search" placeholder="Rechercher un anime, un manga…" aria-label="Rechercher">
    <button class="btn ghost" id="adminBtn">Admin</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<footer>AnimPIX · Créations originales, à regarder entre potes.</footer>

<dialog id="player">
  <button class="close" id="closeP" aria-label="Fermer">&times;</button>
  <video id="vid" controls playsinline></video>
  <div class="pad">
    <div class="info">
      <img id="pPoster" class="pp" alt="">
      <div>
        <div class="tags" id="pTags"></div>
        <h2 id="pTitle"></h2>
        <p id="pDesc"></p>
        <div class="acts">
          <button class="btn ghost" id="favBtn"></button>
          <a class="btn ghost" id="dlBtn" href="#" download>⬇ Télécharger</a>
          <button class="btn ghost" id="editBtn" hidden>✎ Modifier</button>
          <button class="btn ghost" id="gUp" hidden title="Monter dans Mon ordre">↑ Monter</button>
          <button class="btn ghost" id="gDown" hidden title="Descendre dans Mon ordre">↓ Descendre</button>
          <button class="btn ghost" id="delBtn" hidden>Supprimer du site</button>
        </div>
      </div>
    </div>
    <div id="eps"></div>
    <div id="sug"></div>
  </div>
</dialog>

<dialog id="admin">
  <button class="close" id="closeA" aria-label="Fermer">&times;</button>
  <div class="pad">
    <form id="loginForm">
      <h2 class="logo" style="margin:0">Connexion admin</h2>
      <label>E-mail<input type="email" id="em" required autocomplete="username"></label>
      <label>Mot de passe<input type="password" id="pw" required autocomplete="current-password"></label>
      <button class="btn acc">Se connecter</button>
      <p class="msg err" id="loginMsg"></p>
    </form>
    <form id="upForm" hidden>
      <h2 class="logo" style="margin:0">Publier</h2>
      <label>Titre<input id="fTitle" required maxlength="80"></label>
      <label>Synopsis<textarea id="fDesc" maxlength="400"></textarea></label>
      <div class="two">
        <label>Catégorie
          <select id="fCat"><option>Anime</option><option>Manga</option><option>Court-métrage</option><option>Autre</option></select>
        </label>
        <label>Langue
          <select id="fLang"><option>VF</option><option>VOSTFR</option><option>VO</option></select>
        </label>
      </div>
      <div class="three">
        <label>Série / nom (facultatif)<input id="fSerie" maxlength="60"></label>
        <label>Saison n°<input id="fSaison" type="number" min="1" step="1"></label>
        <label>Épisode n°<input id="fEp" type="number" min="1" step="any"></label>
      </div>
      <label>Genres<div class="gch" id="fGen"></div></label>
      <p class="msg" style="min-height:0">Plusieurs fichiers choisis : ils deviennent « Partie 1, 2… » et prennent les numéros 1.1, 1.2… tout seuls (l'Épisode n° est le chiffre avant la virgule).</p>

const fillG = (id, sel = []) => { $("#" + id).innerHTML = GENRES.map(g => `<label><input type="checkbox" value="${g}" ${sel.includes(g) ? "checked" : ""}>${g}</label>`).join(""); };

const LS = {

let items = [], admin = false, term = "", current = null, db, auth, fb = {};
let fav = LS.get("apx_fav", []), prog = LS.get("apx_prog", {});

const img = (v, w, h) => v.thumb.replace("/upload/", `/upload/${v.thumb.includes("/video/") ? "so_2," : ""}c_fill,g_auto,w_${w},h_${h},q_auto/`);
const isNew = v => Date.now() - (v.created?.toMillis?.() ?? Date.now()) < NEW_DAYS * 864e5;
const route = () => decodeURIComponent(location.hash.slice(1)) || "accueil";
const meta = v => v.serie ? v.serie + (v.saison ? ` · S${v.saison}` : "") + (v.ep ? ` · Ép. ${v.ep}` : "") : v.cat;
const pct = v => { const p = prog[v.id]; return p && p.d ? Math.min(100, p.t / p.d * 100) : 0; };
const cmpEp = (a, b) => (a.saison || 0) - (b.saison || 0) || (a.order ?? 1e9) - (b.order ?? 1e9) || (a.ep || 0) - (b.ep || 0);
const epsOf = n => items.filter(x => x.serie === n).sort(cmpEp);
const eps = v => v.serie ? epsOf(v.serie) : [];
const gkey = v => v.serie || v.id;
const groupsOrdered = () => {
  const m = new Map();
  items.forEach((v, i) => { const k = gkey(v), o = v.sorder ?? 1e9, g = m.get(k); if(!g) m.set(k, {k, o, i}); else { g.o = Math.min(g.o, o); g.i = Math.min(g.i, i); } });
  return [...m.values()].sort((a, b) => a.o - b.o || a.i - b.i).map(g => g.k);
};
const ordered = l => { const ix = new Map(groupsOrdered().map((k, i) => [k, i])); return [...l].sort((a, b) => ix.get(gkey(a)) - ix.get(gkey(b)) || cmpEp(a, b)); };
const grp = l => { const s = new Set(), o = []; for(const v of l){ const k = gkey(v); if(s.has(k)) continue; s.add(k); o.push(v.serie ? eps(v)[0] : v); } return o; };
const inProg = v => { const p = prog[v.id]; return p && p.t > 10 && p.t < p.d - 10; };

const card = (v, d) => {
  const g = !d && v.serie ? eps(v) : null;
  const ns = g ? new Set(g.filter(x => x.saison).map(x => x.saison)).size : 0;
  const nw = g ? g.some(isNew) : isNew(v), pc = g ? 0 : pct(v);
  const sub = g ? (ns ? `${ns} saison${ns > 1 ? "s" : ""} · ` : "") + `${g.length} ép.` : meta(v);
  return `<button class="pc" ${d ? "data-id" : "data-g"}="${v.id}"><div class="po"><img loading="lazy" alt="" src="${img(v,300,450)}">${v.lang ? `<span class="bd">${esc(v.lang)}</span>` : ""}${nw ? "<em>NEW</em>" : ""}${pc ? `<i style="width:${pc}%"></i>` : ""}</div><b>${esc(g ? v.serie : v.title)}</b><span class="m">${esc(sub)}</span></button>`;
};
const grid = (l, n = 999, d) => `<div class="grid">${(d ? l : grp(l)).slice(0, n).map(v => card(v, d)).join("")}</div>`;
const SORTS = {ordre: "Mon ordre", recent: "Plus récents", nom: "Nom (A-Z)", saison: "Saison / épisode"};

const head = (t, s) => `<div class="sh"><h1>${esc(t)}</h1>${s ? `<select id="sortSel" aria-label="Trier">${Object.entries(SORTS).map(([k, n]) => `<option value="${k}" ${k === sortBy ? "selected" : ""}>${n}</option>`).join("")}</select>` : ""}</div>`;

    .map(([k,t]) => `<a href="#${encodeURIComponent(k)}" class="${!term && view === k ? "on" : ""}">${esc(t)}</a>`).join("");

  if(term){

function upload(file, type, onProgress, tries = 3){
  return new Promise((ok, ko) => {
    const go = n => {
      const x = new XMLHttpRequest();
      x.open("POST", `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`);
      if(onProgress) x.upload.onprogress = e => e.lengthComputable && onProgress(Math.min(e.loaded, file.size));
      x.onload = () => { let r = {}; try{ r = JSON.parse(x.responseText); }catch{} x.status < 300 ? ok(r) : ko(new Error(r.error?.message || "Échec de l'envoi")); };
      x.onerror = () => n > 1 ? setTimeout(() => go(n - 1), 1500) : ko(new Error("Pas de connexion"));
      const f = new FormData(); f.append("file", file); f.append("upload_preset", UPLOAD_PRESET);
      x.send(f);
    };
    go(tries);
  });
}

const base = "https://www.gstatic.com/firebasejs/10.14.1/";

$("#upForm").onsubmit = async e => {
  e.preventDefault();
  const msg = $("#upMsg"), bar = $("#bar"), cover = $("#fCover").files[0];
  const files = [...$("#fVid").files].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
  const N = files.length, fail = t => { msg.className = "msg err"; msg.textContent = t; };
  msg.className = "msg";
  if(!N) return;
  const big = files.filter(f => f.size > MAX_MB * 1048576);
  if(big.length) return fail(`Trop lourd (max ${MAX_MB} Mo par fichier) : ${big.map(f => f.name).join(", ")}`);
  if(N > 9) return fail("9 parties maximum à la fois.");
  const title = $("#fTitle").value.trim(), serie = $("#fSerie").value.trim() || (N > 1 ? title : "");
  const baseEp = Math.floor(Number($("#fEp").value)) || 1;
  const total = files.reduce((s, f) => s + f.size, 0), loaded = files.map(() => 0), t0 = Date.now();
  let done = 0, next = 0, wl = null;
  const show = () => {
    const L = loaded.reduce((a, b) => a + b, 0), sp = L / ((Date.now() - t0) / 1000 || 1), left = sp > 0 ? (total - L) / sp : 0;
    bar.value = L / total;
    msg.textContent = (N > 1 ? `${done}/${N} parties · ` : "") + `${Math.round(L / total * 100)} %` + (L ? ` · ${(sp / 1048576).toFixed(1)} Mo/s · ~${left > 90 ? Math.ceil(left / 60) + " min" : Math.ceil(left) + " s"}` : "");
  };
  $("#pubBtn").disabled = true; bar.hidden = false; bar.value = 0; msg.textContent = "Envoi… garde cet écran ouvert.";
  try{ wl = await navigator.wakeLock?.request("screen"); }catch{}
  try{
    const coverP = cover ? upload(cover, "image").then(r => r.secure_url) : Promise.resolve("");
    coverP.catch(() => {});
    const worker = async () => {
      while(next < N){
        const i = next++, file = files[i];
        const r = await upload(file, "video", l => { loaded[i] = l; show(); });
        loaded[i] = file.size;
        const coverUrl = await coverP;
        await fb.addDoc(fb.collection(db, "videos"), {
          title: N > 1 ? `${title} - Partie ${i + 1}` : title, desc: $("#fDesc").value.trim(), cat: $("#fCat").value, lang: $("#fLang").value,
          serie, saison: Number($("#fSaison").value) || 0, genres: gGet("fGen"), ep: N > 1 ? Number(`${baseEp}.${i + 1}`) : (Number($("#fEp").value) || 0),
          url: r.secure_url, thumb: coverUrl || r.secure_url.replace(/\.\w+$/, ".jpg"), created: fb.serverTimestamp()
        });
        done++; show();
      }
    };
    await Promise.all([worker(), worker()]);
    msg.textContent = N > 1 ? `${N} parties publiées !` : "Publié !"; e.target.reset(); bar.hidden = true;
  }catch(err){ fail(err.message + (done ? ` (${done} partie(s) déjà publiée(s))` : "")); }
  try{ wl?.release(); }catch{}
  $("#pubBtn").disabled = false;
};

async function commit(up){
  try{
    for(let i = 0; i < up.length; i += 400){
      const b = fb.writeBatch(db);
      up.slice(i, i + 400).forEach(([v, d]) => b.update(fb.doc(db, "videos", v.id), d));
      await b.commit();
    }
  }catch(err){ alert("Échec : " + (err.message || err)); }
}
async function moveGroup(k, d){
  const ord = groupsOrdered(), i = ord.indexOf(k); if(i < 0) return;
  const cat = items.find(v => gkey(v) === k)?.cat;
  let j = i + d;
  while(j >= 0 && j < ord.length && items.find(v => gkey(v) === ord[j])?.cat !== cat) j += d;
  if(j < 0 || j >= ord.length) return;
  [ord[i], ord[j]] = [ord[j], ord[i]];
  const up = [];
  ord.forEach((g, n) => items.filter(v => gkey(v) === g).forEach(v => { if(v.sorder !== n) up.push([v, {sorder: n}]); }));
  sortBy = "ordre"; await commit(up); render();
}
async function moveEp(id, d){
  const l = epsOf(sS), i = l.findIndex(x => x.id === id), j = i + d;
  if(i < 0 || !l[j] || (l[j].saison || 0) !== (l[i].saison || 0)) return;
  [l[i], l[j]] = [l[j], l[i]];
  await commit(l.map((x, n) => [x, {order: n}]).filter(([x, u]) => x.order !== u.order));
}
async function setSeason(id, n){
  const l = epsOf(sS), m = l.find(x => x.id === id); if(!m) return;
  const sOf = x => x.id === id ? n : (x.saison || 0);
  const keys = [...new Set(l.map(sOf))].sort((a, b) => a - b);
  const nl = keys.flatMap(k => { const g = l.filter(x => sOf(x) === k && x.id !== id); return sOf(m) === k ? [...g, m] : g; });
  sN = n;
  await commit(nl.map((x, i) => [x, x.id === id ? {saison: n, order: i} : {order: i}]));
}

function openGroup(id){
  const v = items.find(x => x.id === id); if(!v) return;
  if(v.serie){ if($("#player").open) $("#player").close(); openSeries(v.serie); } else openPlayer(id);
}
function openSeries(name){
  const l = epsOf(name); if(!l.length) return;
  sS = name;
  const pg = l.find(inProg); sN = pg ? (pg.saison || 0) : (l[0].saison || 0);
  renderSeries();
  const dlg = $("#serieD");
  if(!dlg.open){ dlg.showModal(); history.pushState({s: 1}, ""); }
  dlg.scrollTop = 0;
}
function syncSeries(newName){
  const dlg = $("#serieD"); if(!dlg.open) return;
  if(epsOf(sS).length) renderSeries(); else { dlg.close(); if(newName) openSeries(newName); }
}
function renderSeries(){
  const l = epsOf(sS); if(!l.length) return;
  const ss = [...new Set(l.map(x => x.saison || 0))];
  if(!ss.includes(sN)) sN = ss[0];
  const r = l[0], genres = [...new Set(l.flatMap(x => x.genres || []))];
  const lab = n => n ? "Saison " + n : "Épisodes";
  $("#sPoster").src = img(r, 300, 450);
  $("#sTags").innerHTML = (r.lang ? `<span>${esc(r.lang)}</span>` : "") + `<span class="c">${esc(r.cat)}</span>` + genres.map(g => `<span class="c">${esc(g)}</span>`).join("");
  $("#sTitle").textContent = sS;
  $("#sDesc").textContent = (l.find(x => x.desc) || {}).desc || "";
  $("#sPlay").textContent = l.some(inProg) ? "▶ Reprendre" : "▶ Lecture";
  $("#sSeasons").innerHTML = ss.length > 1 ? ss.map(n => `<button class="ep ${n === sN ? "on" : ""}" data-sn="${n}">${lab(n)}</button>`).join("") : "";
  const cur = l.filter(x => (x.saison || 0) === sN), maxS = Math.max(0, ...ss);
  const opts = x => Array.from({length: maxS + 2}, (_, n) => `<option value="${n}" ${n === (x.saison || 0) ? "selected" : ""}>${n ? "Saison " + n : "Sans saison"}</option>`).join("");
  $("#sEps").innerHTML = `<h3 class="s">${lab(sN)} · ${cur.length} ép.</h3>` + cur.map((x, i) => `<div class="er"><button class="th" data-id="${x.id}" aria-label="Lire"><img loading="lazy" alt="" src="${img(x,320,180)}">${pct(x) ? `<i style="width:${pct(x)}%"></i>` : ""}</button><button class="tx" data-id="${x.id}"><b>${esc(x.title)}</b><span>${esc((x.ep ? "Ép. " + x.ep : "") + (x.ep && x.lang ? " · " : "") + (x.lang || ""))}</span></button>${admin ? `<div class="ad"><button data-mv="-1" data-mid="${x.id}" ${i === 0 ? "disabled" : ""} title="Monter">▲</button><button data-mv="1" data-mid="${x.id}" ${i === cur.length - 1 ? "disabled" : ""} title="Descendre">▼</button><select data-ss="${x.id}" title="Changer de saison">${opts(x)}</select><button data-ed="${x.id}" title="Modifier">✎</button></div>` : ""}</div>`).join("");
  adminUI();
}
$("#serieD").addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.sn !== undefined){ sN = Number(t.dataset.sn); renderSeries(); }
  else if(t.dataset.mv) moveEp(t.dataset.mid, Number(t.dataset.mv));
  else if(t.dataset.ed) openEdit(items.find(x => x.id === t.dataset.ed));
});
$("#serieD").addEventListener("change", e => { const id = e.target.dataset?.ss; if(id) setSeason(id, Number(e.target.value)); });
$("#serieD").addEventListener("close", () => { sS = null; render(); });
$("#closeS").onclick = () => history.state?.s ? history.back() : $("#serieD").close();
$("#sPlay").onclick = () => { const l = epsOf(sS), f = l.find(inProg) || l.find(x => (x.saison || 0) === sN) || l[0]; if(f) openPlayer(f.id); };
$("#sUp").onclick = () => sS && moveGroup(sS, -1);
$("#sDown").onclick = () => sS && moveGroup(sS, 1);
$("#gUp").onclick = () => current && moveGroup(gkey(current), -1);
$("#gDown").onclick = () => current && moveGroup(gkey(current), 1);
render();
</script>
</body>
</html>
