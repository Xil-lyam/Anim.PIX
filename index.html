index.htlm<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0912">
<title>AnimPIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070d;--panel:rgba(16,14,26,.66);--panel2:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
  --ink:#f4f1f7;--mute:#a9a3b8;--acc:#ff2d4a;--acc2:#ff8a3d;--gold:#ffc857;--vio:#8b5cf6;--pink:#ec4899;
  --grad:linear-gradient(135deg,#ff2d4a,#ff8a3d);--grad2:linear-gradient(135deg,#8b5cf6,#ec4899);
  --r:18px;--pad:clamp(12px,3vw,40px);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Outfit,system-ui,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(circle at 70% 30%,#5a0716,#07070d 65%)}
#bgv::-webkit-media-controls,#bgv::-webkit-media-controls-start-playback-button,#bgv::-webkit-media-controls-overlay-play-button,#bgv::-webkit-media-controls-panel{display:none!important;-webkit-appearance:none}
#bgv{pointer-events:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:68% 50%;animation:bgin 1.6s ease both}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,13,.55) 0%,rgba(7,7,13,.35) 35%,rgba(7,7,13,.82) 100%)}
@keyframes bgin{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}
/* header */
header{position:sticky;top:0;z-index:5;background:rgba(8,7,14,.72);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),var(--vio),transparent);background-size:200% 100%;animation:flow 6s linear infinite;opacity:.8}
@keyframes flow{to{background-position:-200% 0}}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px var(--pad)}
.logo{font:800 28px/1 Outfit,sans-serif;color:#fff;letter-spacing:-.5px;display:inline-flex;align-items:center}
.logo b{background:var(--grad);color:#fff;border-radius:9px;padding:3px 8px;margin-left:3px;box-shadow:0 0 18px rgba(255,45,74,.55);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 30px rgba(255,138,61,.85)}}
#q{order:3;flex:1 1 100%;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:10px 18px;outline-offset:0;transition:border-color .2s,background .2s,box-shadow .2s}
#q::placeholder{color:var(--mute)}
#q:focus{background:rgba(255,255,255,.14);border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,45,74,.2)}
#adminBtn{margin-left:auto}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:2px var(--pad) 10px;scrollbar-width:none;scroll-snap-type:x proximity}
#tabs::-webkit-scrollbar{display:none}
#tabs a{flex:none;padding:6px 16px;border-radius:999px;font-weight:500;font-size:14.5px;color:var(--mute);border:1px solid transparent;transition:all .2s;scroll-snap-align:start}
#tabs a:hover:not(.on){color:#fff;background:var(--panel2);border-color:var(--line)}
#tabs a.on{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(255,45,74,.45)}
/* buttons */
.btn{border:0;border-radius:999px;padding:9px 20px;font-weight:600;background:var(--grad);color:#fff;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,45,74,.45)}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--grad)}
.btn.ghost{background:var(--panel2);color:#fff;border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.14);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
a.btn{display:inline-block;line-height:1.5}
/* sections */
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h1,.sh h2{font:700 22px/1.2 Outfit,sans-serif;color:#fff;letter-spacing:-.3px}
.sh h2::before{content:"";display:inline-block;width:5px;height:.9em;margin-right:10px;border-radius:3px;background:var(--grad);vertical-align:-.1em}
.sh a{font-size:14px;color:var(--gold);font-weight:600;white-space:nowrap;transition:transform .2s}
.sh a:hover{transform:translateX(3px)}
#main{padding-bottom:6px}
#main>.sh{margin:16px var(--pad) 0;padding:16px 18px 0;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--line);border-bottom:0}
.sec{margin:16px var(--pad);padding:4px 18px 20px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:var(--r);border:1px solid var(--line);animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.sec:nth-child(2){animation-delay:.06s}.sec:nth-child(3){animation-delay:.12s}.sec:nth-child(4){animation-delay:.18s}.sec:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sec .sh{padding:14px 0 12px}
.sh+.sec{margin-top:0;padding-top:14px;border-radius:0 0 var(--r) var(--r);border-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px}
.empty{margin:16px var(--pad);padding:26px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:var(--r);border:1px solid var(--line);color:var(--mute);animation:up .5s both}
.empty h2{font:700 22px Outfit,sans-serif;color:#fff;margin-bottom:4px}
.sh+.empty{margin-top:0;border-radius:0 0 var(--r) var(--r)}
/* hero */
.hero{position:relative;margin:18px var(--pad) 0;padding:clamp(22px,5vw,56px) clamp(18px,4vw,48px);border-radius:calc(var(--r) + 4px);background:linear-gradient(120deg,rgba(255,45,74,.28),rgba(139,92,246,.18) 60%,rgba(255,138,61,.16));border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;animation:up .6s both}
.hero::before{content:"";position:absolute;width:320px;height:320px;right:-80px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(255,45,74,.55),transparent 65%);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
.hero small{display:inline-block;font:600 12px Outfit,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.hero h1{position:relative;font:800 clamp(28px,6vw,54px)/1.05 Outfit,sans-serif;letter-spacing:-1px;max-width:14em;background:linear-gradient(90deg,#fff,#ffd3b0 50%,#ff8aa0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{position:relative;color:#e4dff0;margin:10px 0 18px;max-width:36em}
.hero .acts{position:relative}
.stats{display:flex;gap:18px;margin-top:18px;position:relative;flex-wrap:wrap}
.stats div{font-size:12px;color:var(--mute)}.stats b{display:block;font:800 24px/1 Outfit,sans-serif;color:#fff}
/* cards */
.pc{background:none;border:0;text-align:left;min-width:0;transition:transform .25s cubic-bezier(.2,.8,.2,1);animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.grid .pc:nth-child(2){animation-delay:.04s}.grid .pc:nth-child(3){animation-delay:.08s}.grid .pc:nth-child(4){animation-delay:.12s}.grid .pc:nth-child(5){animation-delay:.16s}.grid .pc:nth-child(6){animation-delay:.2s}.grid .pc:nth-child(n+7){animation-delay:.24s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.pc:hover{transform:translateY(-6px)}
.po{position:relative;border-radius:14px;overflow:hidden;background:#1a1626;aspect-ratio:2/3;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:box-shadow .25s}
.pc:hover .po{box-shadow:0 12px 30px rgba(255,45,74,.45),0 0 0 2px rgba(255,138,61,.7)}
.po img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.pc:hover .po img{transform:scale(1.08)}
.po::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff;background:linear-gradient(180deg,rgba(255,45,74,.15),rgba(7,7,13,.7));opacity:0;transition:opacity .25s}
.pc:hover .po::after{opacity:1}
.bd{position:absolute;top:6px;left:6px;z-index:1;background:rgba(7,7,13,.78);border:1px solid var(--line);color:#fff;font:600 11px Outfit,sans-serif;padding:1px 8px;border-radius:999px}
.po em{position:absolute;top:6px;right:6px;z-index:1;background:linear-gradient(135deg,var(--gold),var(--acc2));color:#2a1200;font:800 11px Outfit,sans-serif;font-style:normal;padding:1px 8px;border-radius:999px;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{filter:brightness(1.25);transform:scale(1.06)}}
.po i{position:absolute;left:0;bottom:0;height:4px;background:var(--grad);z-index:1}
.pc b{display:-webkit-box;margin-top:8px;font-weight:600;font-size:14px;line-height:1.25;color:#fff;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc span.m{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec.hz .grid{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 12px;margin:0 -4px;scrollbar-width:thin}
.sec.hz .pc{flex:none;width:clamp(112px,30vw,160px);scroll-snap-align:start}
/* catalogue */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tiles.sm{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:78px;padding:12px 16px;border-radius:14px;color:#fff;background:var(--grad);box-shadow:0 6px 18px rgba(255,45,74,.28);transition:transform .25s,box-shadow .25s}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.tile:hover::after{transform:translateX(120%)}
.tile.g{background:var(--grad2);box-shadow:0 6px 18px rgba(139,92,246,.3)}
.tile:hover{transform:translateY(-4px) scale(1.02)}
.tile b{font:700 16px/1.2 Outfit,sans-serif}.tile span{font-size:12px;opacity:.9}
.tiles.sm .tile{min-height:58px;padding:9px 13px}.tiles.sm .tile b{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.fl{margin:8px 0 16px}
.ep{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:600;color:#fff;transition:all .2s}
.ep:hover{background:rgba(255,255,255,.14)}
.ep.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(255,45,74,.4)}
footer{margin:16px var(--pad) calc(24px + env(safe-area-inset-bottom));padding:14px 18px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);color:var(--mute);font-size:13px;text-align:center}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:var(--r);background:#0e0c18;color:var(--ink);padding:0;width:min(1000px,100vw);max-width:100vw;max-height:100vh;max-height:100dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(255,45,74,.18)}
dialog[open]{animation:dlg .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes dlg{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(4,3,10,.75);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pad{padding:18px}
.close{position:absolute;right:10px;top:10px;z-index:2;background:rgba(0,0,0,.6);color:#fff;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1;transition:transform .2s,background .2s}
.close:hover{background:var(--acc);transform:rotate(90deg)}
#vid{display:block;width:100%;max-height:68vh;background:#000}
.info{display:flex;gap:16px}
.pp{width:92px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;flex:none;align-self:flex-start;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.info h2{font:700 26px/1.15 Outfit,sans-serif;margin:8px 0}
.info p{color:var(--mute);margin-bottom:12px}
.tags span{display:inline-block;background:var(--grad);color:#fff;font:600 12px Outfit,sans-serif;padding:1px 10px;border-radius:999px;margin:0 4px 4px 0}
.tags span.c{background:var(--panel2);border:1px solid var(--line);color:#e8e3f2}
.acts{display:flex;gap:8px;flex-wrap:wrap}
h3.s{font:700 17px Outfit,sans-serif;border-left:3px solid var(--acc);padding-left:10px;margin:22px 0 12px;color:#fff}
/* forms */
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
input,select,textarea{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,45,74,.2)}
option{background:#14111f;color:#fff}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
progress{width:100%;height:8px;accent-color:var(--acc2)}
.msg{font-size:14px;min-height:20px;color:var(--mute)}
.msg.err{color:#ff6b7f}
[hidden]{display:none!important}
#sortSel{border-radius:999px;padding:5px 14px;font-size:14px}
.gch{display:flex;flex-wrap:wrap;gap:6px}
.gch label{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:#fff;cursor:pointer;transition:background .2s}
.gch label:hover{background:rgba(255,255,255,.14)}
.gch input{padding:0;accent-color:var(--acc)}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.er{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:var(--panel2);border:1px solid transparent;margin-bottom:8px;transition:background .2s,border-color .2s,transform .2s}
.er:hover{background:rgba(255,255,255,.1);border-color:rgba(255,45,74,.4);transform:translateX(3px)}
.er .th{position:relative;width:104px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;flex:none;background:#1a1626;border:0;padding:0}
.er .th img{width:100%;height:100%;object-fit:cover;display:block}
.er .th i{position:absolute;left:0;bottom:0;height:3px;background:var(--grad)}
.er .tx{flex:1;min-width:0;background:none;border:0;text-align:left}
.er .tx b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er .tx span{font-size:12px;color:var(--mute)}
.er .ad{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.er .ad button,.er .ad select{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:8px;padding:3px 8px;font-size:13px}
.er .ad button:disabled{opacity:.35;cursor:default}
/* responsive */
@media(max-width:560px){
  .logo{font-size:24px}
  .sec,#main>.sh{padding-left:12px;padding-right:12px}
  .grid{grid-template-columns:repeat(3,1fr);gap:14px 8px}
  .pc b{font-size:12.5px}
  dialog{width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:0}
  .info{flex-direction:column}
  .info .pp{width:110px}
  .info h2{font-size:22px}
  .three{grid-template-columns:1fr 1fr}.three label:first-child{grid-column:1/-1}
  .er{flex-wrap:wrap}.er .th{width:96px}.er .ad{width:100%;justify-content:flex-start}
  #bgv{object-position:72% 50%}
}
@media(min-width:700px){
  #q{order:0;flex:1;max-width:520px;margin:0 auto}
  #adminBtn{margin-left:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
  dialog{max-height:94vh}
  .pp{width:150px}
}
@media(min-width:1200px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.sec.hz .pc{width:170px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
/* ====== CONFIG ====== */
const FIREBASE = {
  apiKey: "AIzaSyD90LXRc_pRV2KpAujKyCIgVplMasBvrSs",
  authDomain: "xil-book.firebaseapp.com",
  projectId: "xil-book",
  appId: "1:290319178475:web:43b6e6dd2ecd0fefae7cae"
};
const CLOUD_NAME = "haxtqhcv";
const UPLOAD_PRESET = "ToonBox";
/* ==================== */
const MAX_MB = 100, NEW_DAYS = 7;
const GENRES = ["Romance","Action","Aventure","Comédie","Drame","Fantastique","Horreur","Science-fiction","Slice of life","Thriller","Mystère","Sport","Isekai"];
const fillG = (id, sel = []) => { $("#" + id).innerHTML = GENRES.map(g => `<label><input type="checkbox" value="${g}" ${sel.includes(g) ? "checked" : ""}>${g}</label>`).join(""); };
const gGet = id => [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let items = [], admin = false, term = "", current = null, db, auth, fb = {};
let fav = LS.get("apx_fav", []), prog = LS.get("apx_prog", {});
let sS = null, sN = 0, editId = null;

const img = (v, w, h) => v.thumb.replace("/upload/", `/upload/${v.thumb.includes("/video/") ? "so_2," : ""}c_fill,g_auto,w_${w},h_${h},q_auto/`);
const isNew = v => Date.now() - (v.created?.toMillis?.() ?? Date.now()) < NEW_DAYS * 864e5;
const route = () => decodeURIComponent(location.hash.slice(1)) || "accueil";
const meta = v => v.serie ? v.serie + (v.saison ? ` · S${v.saison}` : "") + (v.ep ? ` · Ép. ${v.ep}` : "") : v.cat;
const pct = v => { const p = prog[v.id]; return p && p.d ? Math.min(100, p.t / p.d * 100) : 0; };
const cmpEp = (a, b) => (a.saison || 0) - (b.saison || 0) || (a.order ?? 1e9) - (b.order ?? 1e9) || (a.ep || 0) - (b.ep || 0);
const nm = v => (v.serie || v.title || "").trim().toLowerCase();
const gkey = v => (v.cat || "") + "|" + nm(v);
const epsOf = k => items.filter(x => gkey(x) === k).sort(cmpEp);
const eps = v => epsOf(gkey(v));
const isGrp = v => !!v.serie || eps(v).length > 1;
const groupsOrdered = () => {
  const m = new Map();
  items.forEach((v, i) => { const k = gkey(v), o = v.sorder ?? 1e9, g = m.get(k); if(!g) m.set(k, {k, o, i}); else { g.o = Math.min(g.o, o); g.i = Math.min(g.i, i); } });
  return [...m.values()].sort((a, b) => a.o - b.o || a.i - b.i).map(g => g.k);
};
const ordered = l => { const ix = new Map(groupsOrdered().map((k, i) => [k, i])); return [...l].sort((a, b) => ix.get(gkey(a)) - ix.get(gkey(b)) || cmpEp(a, b)); };
const grp = l => { const s = new Set(), o = []; for(const v of l){ const k = gkey(v); if(s.has(k)) continue; s.add(k); o.push(eps(v)[0]); } return o; };
const inProg = v => { const p = prog[v.id]; return p && p.t > 10 && p.t < p.d - 10; };

const card = (v, d) => {
  const g = !d && isGrp(v) ? eps(v) : null;
  const ns = g ? new Set(g.filter(x => x.saison).map(x => x.saison)).size : 0;
  const nw = g ? g.some(isNew) : isNew(v), pc = g ? 0 : pct(v);
  const sub = g ? (ns ? `${ns} saison${ns > 1 ? "s" : ""} · ` : "") + `${g.length} ép.` : meta(v);
  return `<button class="pc" ${d ? "data-id" : "data-g"}="${v.id}"><div class="po"><img loading="lazy" alt="" src="${img(v,300,450)}">${v.lang ? `<span class="bd">${esc(v.lang)}</span>` : ""}${nw ? "<em>NEW</em>" : ""}${pc ? `<i style="width:${pc}%"></i>` : ""}</div><b>${esc(g ? (v.serie || v.title) : v.title)}</b><span class="m">${esc(sub)}</span></button>`;
};
const grid = (l, n = 999, d) => `<div class="grid">${(d ? l : grp(l)).slice(0, n).map(v => card(v, d)).join("")}</div>`;
const SORTS = {ordre: "Mon ordre", recent: "Plus récents", nom: "Nom (A-Z)", saison: "Saison / épisode"};
let sortBy = "ordre";
const byName = (a, b) => (a.serie || a.title).localeCompare(b.serie || b.title, "fr", {numeric: true}) || (a.saison || 0) - (b.saison || 0) || (a.ep || 0) - (b.ep || 0);
const bySeason = (a, b) => (a.saison || 0) - (b.saison || 0) || byName(a, b);
const srt = l => sortBy === "nom" ? [...l].sort(byName) : sortBy === "saison" ? [...l].sort(bySeason) : sortBy === "ordre" ? ordered(l) : l;
const head = (t, s) => `<div class="sh"><h1>${esc(t)}</h1>${s ? `<select id="sortSel" aria-label="Trier">${Object.entries(SORTS).map(([k, n]) => `<option value="${k}" ${k === sortBy ? "selected" : ""}>${n}</option>`).join("")}</select>` : ""}</div>`;
const sec = (t, l, link, d) => l.length ? `<section class="sec hz"><div class="sh"><h2>${esc(t)}</h2>${link ? `<a href="#${encodeURIComponent(link)}">Voir tout ›</a>` : ""}</div>${grid(l, 12, d)}</section>` : "";

const cnt = f => items.filter(f);
const nGrp = l => new Set(l.map(gkey)).size;
const tile = (href, name, l, cls) => `<a class="tile ${cls || ""}" href="#${encodeURIComponent(href)}"><b>${esc(name)}</b><span>${nGrp(l)} titre${nGrp(l) > 1 ? "s" : ""}</span></a>`;
const hero = () => `<section class="hero"><small>Streaming entre potes</small><h1>Tes animés, mangas et créations, au même endroit.</h1><p>Reprends où tu t'es arrêté, explore le catalogue par catégorie ou par genre.</p><div class="acts"><a class="btn" href="#nouveautes">▶ Nouveautés</a><a class="btn ghost" href="#catalogue">Explorer le catalogue</a></div><div class="stats"><div><b>${nGrp(items)}</b>titres</div><div><b>${items.length}</b>épisodes</div><div><b>${new Set(items.map(v => v.cat)).size}</b>catégories</div></div></section>`;
function render(){
  const m = $("#main"), r = route();
  if(!items.length){
    m.innerHTML = `<div class="empty"><h2>Aucune vidéo pour l'instant</h2><p>Clique sur Admin, connecte-toi et publie ta première création.</p></div>`;
    $("#tabs").innerHTML = ""; return;
  }
  const cats = [...new Set(items.map(v => v.cat))];
  const gens = GENRES.filter(g => items.some(v => (v.genres || []).includes(g)));
  const [rc, rg] = r.split("/");
  const gOk = rg && rg.startsWith("g:") && gens.includes(rg.slice(2)) ? rg.slice(2) : "";
  const view = ["accueil","nouveautes","catalogue","liste"].includes(r) || (cats.includes(rc) && (!rg || gOk)) || (r.startsWith("g:") && gens.includes(r.slice(2))) ? r : "accueil";
  const tabOn = view.split("/")[0];
  $("#tabs").innerHTML = [["accueil","Accueil"],["nouveautes","Nouveautés"],["catalogue","Catalogue"],...cats.map(c => [c,c]),...gens.map(g => ["g:" + g, g]),["liste","Ma liste"]]
    .map(([k,t]) => `<a href="#${encodeURIComponent(k)}" class="${!term && tabOn === k ? "on" : ""}">${esc(t)}</a>`).join("");

  if(term){
    const l = items.filter(v => (v.title + " " + v.cat + " " + (v.serie || "") + " " + (v.genres || []).join(" ")).toLowerCase().includes(term));
    m.innerHTML = head("Résultats", 1) + (l.length ? `<div class="sec">${grid(srt(l))}</div>` : `<div class="empty"><p>Rien trouvé pour « ${esc(term)} ».</p></div>`);
  }else if(view === "nouveautes"){
    m.innerHTML = head("Nouveautés") + `<div class="sec">${grid(items.slice(0, 40))}</div>`;
  }else if(view === "catalogue"){
    m.innerHTML = `<div class="sec"><div class="sh"><h1>Catalogue</h1></div>`
      + `<h3 class="s">Catégories</h3><div class="tiles">${cats.map(c => tile(c, c, cnt(v => v.cat === c))).join("")}</div>`
      + (gens.length ? `<h3 class="s">Genres</h3><div class="tiles">${gens.map(g => tile("g:" + g, g, cnt(v => (v.genres || []).includes(g)), "g")).join("")}</div>` : "")
      + `</div>`
      + cats.map(c => {
          const inC = items.filter(v => v.cat === c), gs = gens.filter(g => inC.some(v => (v.genres || []).includes(g)));
          return `<section class="sec"><div class="sh"><h2>${esc(c)}</h2><a href="#${encodeURIComponent(c)}">Voir tout ›</a></div>`
            + (gs.length ? `<div class="tiles sm">${gs.map(g => tile(c + "/g:" + g, g, inC.filter(v => (v.genres || []).includes(g)), "g")).join("")}</div>` : `<p class="msg">Aucun genre renseigné.</p>`) + `</section>`;
        }).join("");
  }else if(view === "liste"){
    const l = items.filter(v => fav.includes(v.id));
    m.innerHTML = head("Ma liste", 1) + (l.length ? `<div class="sec">${grid(srt(l))}</div>` : `<div class="empty"><p>Vide pour l'instant. Ouvre une vidéo et appuie sur « Ajouter à ma liste ».</p></div>`);
  }else if(view.startsWith("g:")){
    m.innerHTML = head(view.slice(2), 1) + `<div class="sec">${grid(srt(items.filter(v => (v.genres || []).includes(view.slice(2)))))}</div>`;
  }else if(view !== "accueil"){
    const inC = items.filter(v => v.cat === rc), gs = gens.filter(g => inC.some(v => (v.genres || []).includes(g)));
    const chips = gs.length ? `<div class="chips fl"><a class="ep ${gOk ? "" : "on"}" href="#${encodeURIComponent(rc)}">Tous</a>${gs.map(g => `<a class="ep ${gOk === g ? "on" : ""}" href="#${encodeURIComponent(rc + "/g:" + g)}">${esc(g)}</a>`).join("")}</div>` : "";
    const l = gOk ? inC.filter(v => (v.genres || []).includes(gOk)) : inC;
    m.innerHTML = head(rc + (gOk ? " · " + gOk : ""), 1) + `<div class="sec">${chips}${grid(srt(l))}</div>`;
  }else{
    const cont = items.filter(v => { const p = prog[v.id]; return p && p.t > 10 && p.t < p.d - 10; });
    m.innerHTML = hero() + sec("Reprendre la lecture", cont, "", 1) + sec("Derniers ajouts", items, "nouveautes")
      + cats.map(c => sec(c, ordered(items.filter(v => v.cat === c)), c)).join("")
      + gens.map(g => sec(g, ordered(items.filter(v => (v.genres || []).includes(g))), "g:" + g)).join("");
  }
}

function upload(file, type, onProgress, tries = 3){
  return new Promise((ok, ko) => {
    const go = n => {
      const x = new XMLHttpRequest();
      x.open("POST", `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`);
      if(onProgress) x.upload.onprogress = e => e.lengthComputable && onProgress(Math.min(e.loaded, file.size));
      x.onload = () => { let r = {}; try{ r = JSON.parse(x.responseText); }catch{} x.status < 300 ? ok(r) : ko(new Error(r.error?.message || "Échec de l'envoi")); };
      x.onerror = () => n > 1 ? setTimeout(() => go(n - 1), 1500) : ko(new Error("Pas de connexion"));
      const f = new FormData(); f.append("file", file); f.append("upload_preset", UPLOAD_PRESET);
      x.send(f);
    };
    go(tries);
  });
}

$("#upForm").onsubmit = async e => {
  e.preventDefault();
  const msg = $("#upMsg"), bar = $("#bar"), cover = $("#fCover").files[0];
  const files = [...$("#fVid").files].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
  const N = files.length, fail = t => { msg.className = "msg err"; msg.textContent = t; };
  msg.className = "msg";
  if(!N) return;
  const big = files.filter(f => f.size > MAX_MB * 1048576);
  if(big.length) return fail(`Trop lourd (max ${MAX_MB} Mo par fichier) : ${big.map(f => f.name).join(", ")}`);
  if(N > 9) return fail("9 parties maximum à la fois.");
  const title = $("#fTitle").value.trim(), serie = $("#fSerie").value.trim() || (N > 1 ? title : "");
  const baseEp = Math.floor(Number($("#fEp").value)) || 1;
  const total = files.reduce((s, f) => s + f.size, 0), loaded = files.map(() => 0), t0 = Date.now();
  let done = 0, next = 0, wl = null;
  const show = () => {
    const L = loaded.reduce((a, b) => a + b, 0), sp = L / ((Date.now() - t0) / 1000 || 1), left = sp > 0 ? (total - L) / sp : 0;
    bar.value = L / total;
    msg.textContent = (N > 1 ? `${done}/${N} parties · ` : "") + `${Math.round(L / total * 100)} %` + (L ? ` · ${(sp / 1048576).toFixed(1)} Mo/s · ~${left > 90 ? Math.ceil(left / 60) + " min" : Math.ceil(left) + " s"}` : "");
  };
  $("#pubBtn").disabled = true; bar.hidden = false; bar.value = 0; msg.textContent = "Envoi… garde cet écran ouvert.";
  try{ wl = await navigator.wakeLock?.request("screen"); }catch{}
  try{
    const coverP = cover ? upload(cover, "image").then(r => r.secure_url) : Promise.resolve("");
    coverP.catch(() => {});
    const worker = async () => {
      while(next < N){
        const i = next++, file = files[i];
        const r = await upload(file, "video", l => { loaded[i] = l; show(); });
        loaded[i] = file.size;
        const coverUrl = await coverP;
        await fb.addDoc(fb.collection(db, "videos"), {
          title: N > 1 ? `${title} - Partie ${i + 1}` : title, desc: $("#fDesc").value.trim(), cat: $("#fCat").value, lang: $("#fLang").value,
          serie, saison: Number($("#fSaison").value) || 0, genres: gGet("fGen"), ep: N > 1 ? Number(`${baseEp}.${i + 1}`) : (Number($("#fEp").value) || 0),
          url: r.secure_url, thumb: coverUrl || r.secure_url.replace(/\.\w+$/, ".jpg"), created: fb.serverTimestamp()
        });
        done++; show();
      }
    };
    await Promise.all([worker(), worker()]);
    msg.textContent = N > 1 ? `${N} parties publiées !` : "Publié !"; e.target.reset(); bar.hidden = true;
  }catch(err){ fail(err.message + (done ? ` (${done} partie(s) déjà publiée(s))` : "")); }
  try{ wl?.release(); }catch{}
  $("#pubBtn").disabled = false;
};

async function commit(up){
  try{
    for(let i = 0; i < up.length; i += 400){
      const b = fb.writeBatch(db);
      up.slice(i, i + 400).forEach(([v, d]) => b.update(fb.doc(db, "videos", v.id), d));
      await b.commit();
    }
  }catch(err){ alert("Échec : " + (err.message || err)); }
}
async function moveGroup(k, d){
  const ord = groupsOrdered(), i = ord.indexOf(k); if(i < 0) return;
  const cat = items.find(v => gkey(v) === k)?.cat;
  let j = i + d;
  while(j >= 0 && j < ord.length && items.find(v => gkey(v) === ord[j])?.cat !== cat) j += d;
  if(j < 0 || j >= ord.length) return;
  [ord[i], ord[j]] = [ord[j], ord[i]];
  const up = [];
  ord.forEach((g, n) => items.filter(v => gkey(v) === g).forEach(v => { if(v.sorder !== n) up.push([v, {sorder: n}]); }));
  sortBy = "ordre"; await commit(up); render();
}
async function moveEp(id, d){
  const l = epsOf(sS), i = l.findIndex(x => x.id === id), j = i + d;
  if(i < 0 || !l[j] || (l[j].saison || 0) !== (l[i].saison || 0)) return;
  [l[i], l[j]] = [l[j], l[i]];
  await commit(l.map((x, n) => [x, {order: n}]).filter(([x, u]) => x.order !== u.order));
}
async function setSeason(id, n){
  const l = epsOf(sS), m = l.find(x => x.id === id); if(!m) return;
  const sOf = x => x.id === id ? n : (x.saison || 0);
  const keys = [...new Set(l.map(sOf))].sort((a, b) => a - b);
  const nl = keys.flatMap(k => { const g = l.filter(x => sOf(x) === k && x.id !== id); return sOf(m) === k ? [...g, m] : g; });
  sN = n;
  await commit(nl.map((x, i) => [x, x.id === id ? {saison: n, order: i} : {order: i}]));
}

function openSeries(name){
  const l = epsOf(name); if(!l.length) return;
  sS = name;
  const pg = l.find(inProg); sN = pg ? (pg.saison || 0) : (l[0].saison || 0);
  renderSeries();
  const dlg = $("#serieD");
  if(!dlg.open){ dlg.showModal(); history.pushState({s: 1}, ""); }

  const dlg = $("#serieD"); if(!dlg.open) return;
  if(epsOf(sS).length) renderSeries(); else { dlg.close(); if(newName) openSeries(newName); }
}
function renderSeries(){
  const l = epsOf(sS); if(!l.length) return;
  const ss = [...new Set(l.map(x => x.saison || 0))];
  if(!ss.includes(sN)) sN = ss[0];
  const r = l[0], genres = [...new Set(l.flatMap(x => x.genres || []))];
  const lab = n => n ? "Saison " + n : "Épisodes";
  $("#sPoster").src = img(r, 300, 450);
  $("#sTags").innerHTML = (r.lang ? `<span>${esc(r.lang)}</span>` : "") + `<span class="c">${esc(r.cat)}</span>` + genres.map(g => `<span class="c">${esc(g)}</span>`).join("");
  $("#sTitle").textContent = r.serie || r.title;
  $("#sDesc").textContent = (l.find(x => x.desc) || {}).desc || "";
  $("#sPlay").textContent = l.some(inProg) ? "▶ Reprendre" : "▶ Lecture";
  $("#sSeasons").innerHTML = ss.length > 1 ? ss.map(n => `<button class="ep ${n === sN ? "on" : ""}" data-sn="${n}">${lab(n)}</button>`).join("") : "";
  const cur = l.filter(x => (x.saison || 0) === sN), maxS = Math.max(0, ...ss);
  const opts = x => Array.from({length: maxS + 2}, (_, n) => `<option value="${n}" ${n === (x.saison || 0) ? "selected" : ""}>${n ? "Saison " + n : "Sans saison"}</option>`).join("");
  $("#sEps").innerHTML = `<h3 class="s">${lab(sN)} · ${cur.length} ép.</h3>` + cur.map((x, i) => `<div class="er"><button class="th" data-id="${x.id}" aria-label="Lire"><img loading="lazy" alt="" src="${img(x,320,180)}">${pct(x) ? `<i style="width:${pct(x)}%"></i>` : ""}</button><button class="tx" data-id="${x.id}"><b>${esc(x.title)}</b><span>${esc((x.ep ? "Ép. " + x.ep : "") + (x.ep && x.lang ? " · " : "") + (x.lang || ""))}</span></button>${admin ? `<div class="ad"><button data-mv="-1" data-mid="${x.id}" ${i === 0 ? "disabled" : ""} title="Monter">▲</button><button data-mv="1" data-mid="${x.id}" ${i === cur.length - 1 ? "disabled" : ""} title="Descendre">▼</button><select data-ss="${x.id}" title="Changer de saison">${opts(x)}</select><button data-ed="${x.id}" title="Modifier">✎</button></div>` : ""}</div>`).join("");
  adminUI();
}
